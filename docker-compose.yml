# Backend + Postgres/pgvector in one command: `docker compose up`.
# Put API keys in server/.env (never committed). The frontend (Pages/Vercel/`npm run dev`)
# points at http://localhost:8000 by default, or set its backend URL in Settings.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dexter
      POSTGRES_PASSWORD: dexter
      POSTGRES_DB: dexter
    volumes:
      - dexter-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexter"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DEXTER_DATABASE_URL: postgresql://dexter:dexter@db:5432/dexter
      # Ollama on the host machine, if you run it (Docker Desktop hostname)
      DEXTER_OLLAMA_BASE_URL: ${DEXTER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dexter-db:
